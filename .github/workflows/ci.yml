name: check

# Minimal Linux gate (spec F8.5.0 D-4). Builds and tests run on the developer's Mac via
# `just pr`, which publishes the `local/just-pr` commit status required by branch protection.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tooling self-tests clone the repo locally
      - name: Install pinned opengrep
        run: tools/scripts/setup.sh --ci
      - name: opengrep
        run: tools/scripts/scan.sh
      - name: Tooling self-tests
        run: |
          git config --global user.email ci@example.invalid && git config --global user.name ci
          tools/scripts/test-pr-guards.sh && tools/scripts/test-pr-gate.sh
      - name: Read pinned uv version
        id: uv
        run: |
          source tools/versions.env
          echo "version=${UV_VERSION}" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ steps.uv.outputs.version }}
      - name: Bench tooling tests
        run: uv run --locked --project tools/bench pytest -q
      - name: SwiftLint
        run: |
          source tools/versions.env
          docker run --rm -v "$PWD:/src" -w /src "ghcr.io/realm/swiftlint:${SWIFTLINT_VERSION}" \
            swiftlint lint --strict --quiet
